name: CI — baseline
on:
  push:
    branches: [ main, audit/ci-baseline ]
  pull_request:
    branches: [ main ]
jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Run tests (if present)
        run: npm run test --if-present
      - name: Build (if present)
        run: npm run build --if-present
      - name: List repo (debug)
        run: ls -la
