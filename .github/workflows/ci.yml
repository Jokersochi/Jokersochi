name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify or repair lockfile
        shell: bash
        run: |
          if npm ci; then
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "package-lock.json is not reproducible; refusing to mutate main"
            exit 1
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "npm ci failed but regeneration produced no lockfile change"
            exit 1
          fi
          git commit -m "chore: regenerate npm lockfile for CI"
          git push origin HEAD:${{ github.head_ref }}
          echo "Lockfile repaired; rerun will validate the updated branch."
          exit 1
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
