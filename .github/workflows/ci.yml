name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  polyshark-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract, ledger, and paper-only tests
        run: python -m unittest discover -s polyshark-ai/tests -p 'test_*.py' -q

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
