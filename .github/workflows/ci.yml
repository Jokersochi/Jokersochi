name: CI

permissions:
  contents: read
  issues: write

on:
  pull_request:
    branches: [main]

jobs:
  capture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture Jest errors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test -- --runInBand > /tmp/jest.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Jest is clean"
            exit 0
          fi
          {
            echo 'Jest failed on PR #${{ github.event.pull_request.number }}.'
            echo
            echo '```text'
            cat /tmp/jest.log
            echo '```'
          } > /tmp/jest-issue.md
          gh issue create --title "[CI DIAGNOSTIC] Profile Jest PR #${{ github.event.pull_request.number }}" --body-file /tmp/jest-issue.md
          exit 1
