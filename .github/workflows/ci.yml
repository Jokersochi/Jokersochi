name: CI

permissions:
  contents: write

on:
  pull_request:
    branches: [main]

jobs:
  capture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture Jest errors
        run: |
          mkdir -p .ci
          set +e
          npm test -- --runInBand > .ci/jest.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Jest is clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/jest.log
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Jest diagnostics"
            git push origin HEAD:${{ github.head_ref }}
          fi
          cat .ci/jest.log
          exit 1
