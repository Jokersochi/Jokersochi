name: LotoOS verify and publish

on:
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/loto-refresh.yml"
      - ".github/workflows/loto-ci.yml"
      - "scripts/loto-*.mjs"
      - "public/loto-analytics-4x20/**"
      - "supabase/functions/sync-lotoos-4x20/**"
      - "supabase/functions/advance-lotoos-evidence/**"

permissions:
  contents: write

concurrency:
  group: lotoos-verify-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: LotoOS unit tests
        run: node --test scripts/loto-strategy.test.mjs

      - name: Canonical Supabase live smoke
        run: node scripts/loto-live-smoke.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Publish code build only
        if: github.event_name != 'schedule'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: Canonical ownership notice
        run: |
          echo "Supabase owns the canonical draw archive, payouts, forward locks and evidence."
          echo "GitHub Actions verifies code and publishes the UI; it does not mutate canonical lottery data."
