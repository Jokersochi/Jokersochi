name: PolyShark BTC Independent-Price Research

on:
  workflow_dispatch:
  schedule:
    # Best effort; schedule delay is expected on shared GitHub Actions runners.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "polyshark-ai/runtime/spot_research.py"
      - "polyshark-ai/tests/test_spot_research.py"
      - "polyshark-ai/runtime/btc_forward_evaluation.py"
      - "polyshark-ai/runtime/btc_robustness.py"
      - "polyshark-ai/tests/test_btc_forward_evaluation.py"
      - "polyshark-ai/tests/test_btc_robustness.py"
      - ".github/workflows/polyshark-btc-research.yml"

permissions:
  contents: write

concurrency:
  group: polyshark-btc-research
  cancel-in-progress: false

jobs:
  read-only-market-research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Checkout independent forward-research data branch
        uses: actions/checkout@v4
        with:
          ref: polyshark-btc-forward-data
          path: btc-forward-data
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify strict read-only semantics and unit tests
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path("polyshark-ai/runtime/spot_research.py").read_text(encoding="utf-8")
          forbidden = (
              "create_order(", "post_order(", "cancel_all(",
              "POLYMARKET_PRIVATE_KEY", "requests.post(", "urlopen(req, data=",
          )
          assert not any(item in script for item in forbidden)
          print("No authenticated CLOB or order paths")
          PY
          python polyshark-ai/tests/test_spot_research.py -q
          python polyshark-ai/tests/test_btc_forward_evaluation.py -q
          python polyshark-ai/tests/test_btc_robustness.py -q
          python -m py_compile polyshark-ai/runtime/spot_research.py polyshark-ai/runtime/btc_forward_evaluation.py polyshark-ai/runtime/btc_robustness.py

      - name: Generate independent spot research snapshot (NO_TRADE)
        run: |
          python polyshark-ai/runtime/spot_research.py \
            --output /tmp/polyshark-btc-research.json || echo "::warning::Research blocked: no trade or shadow signal authorized"

      - name: Append new forward-only snapshot and verify settled outcomes
        run: |
          python polyshark-ai/runtime/btc_forward_evaluation.py \
            --report /tmp/polyshark-btc-research.json \
            --ledger btc-forward-data/polyshark-ai/research/btc_forward_ledger.json \
            --output /tmp/polyshark-btc-forward-summary.json

      - name: Enforce research-only forward-evaluation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('/tmp/polyshark-btc-forward-summary.json').read_text(encoding='utf-8'))
          assert s['paper_only'] is True
          assert s['real_orders_enabled'] is False
          assert s['capital_decision'] == 'NO_TRADE'
          assert s['research_only'] is True
          assert s['metrics']['calibration_review_eligible'] is False
          assert s['metrics']['forward_uncertainty']['strategy_promotion'] == 'BLOCKED'
          assert s['metrics']['forward_uncertainty']['can_claim_positive_edge'] is False
          metrics = s['metrics']
          print('Forward-only:', {
              'snapshots': s['snapshot_count'],
              'pending_days': s['pending_event_days'],
              'new_resolutions': s['new_resolutions'],
              'resolved_unique_days': metrics['resolved_unique_event_days'],
              'brier_model': metrics['brier_model_event_weighted'],
              'brier_market': metrics['brier_market_event_weighted'],
              'hypothetical_pnl_1_share': metrics['illustrative_one_share_pnl_usd'],
          })
          lines = [
              "## Forward BTC forecast verification (RESEARCH-ONLY)",
              "- Resolved independent **event days**: " + str(metrics["resolved_unique_event_days"]),
              "- Event-weighted model ECE (**descriptive only**): "
                + str(metrics["calibration_model"]["ece_event_weighted_descriptive"]),
              "- Event-weighted market ECE (**descriptive only**): "
                + str(metrics["calibration_market"]["ece_event_weighted_descriptive"]),
              "- Review blockers: " + ", ".join(metrics["calibration_review_blockers"]),
              "- Serial-dependence uncertainty: " + metrics["forward_uncertainty"]["status"],
              "- Brier advantage 95% descriptive block interval: "
                + str(metrics["forward_uncertainty"]["brier_advantage_ci95"]),
              "- Hypothetical one-share/day P&L 95% block interval (NOT fills): "
                + str(metrics["forward_uncertainty"]["hypothetical_one_share_daily_pnl_ci95"]),
              "- Bootstrap resampling requires 50 consecutive event days; "
                "never grants strategy promotion.",
              "- Brier model (lower better): " + str(metrics["brier_model_event_weighted"]),
              "- Brier market baseline: " + str(metrics["brier_market_event_weighted"]),
              "- Hypothetical one-share total P&L (NOT paper fills): "
                + str(metrics["illustrative_one_share_pnl_usd"]),
              "- Forecasts: " + str(s["snapshot_count"])
                + "; pending days: " + str(s["pending_event_days"]),
              "- NO_TRADE, no calibration approval; market fills and impact NOT verified.",
              "- Previously saved Nov 16-17 fee coefficient 5% was a historical unverified scenario.",
              "- New samples use Gamma per-market feeSchedule when supported.",
              "- Horizon-bucket diagnostics are correlated and excluded from independent N.",
          ]
          summary = "\n".join(lines) + "\n"
          print(summary)
          import os
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write(summary)
          PY

      - name: Persist forward ledger on separate data branch only
        run: |
          git -C btc-forward-data config user.name "polyshark-research-bot"
          git -C btc-forward-data config user.email "polyshark-research-bot@users.noreply.github.com"
          git -C btc-forward-data add -- polyshark-ai/research/btc_forward_ledger.json
          if git -C btc-forward-data diff --cached --quiet; then
            echo "No new independent forward sample or verified settlement"
          else
            git -C btc-forward-data commit -m "data(polyshark): append immutable forward snapshot / verified BTC outcome [skip ci]"
            git -C btc-forward-data push origin HEAD:polyshark-btc-forward-data
          fi

      - name: Show research status and enforce NO_TRADE
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          r = json.loads(Path("/tmp/polyshark-btc-research.json").read_text(encoding="utf-8"))
          assert r.get("capital_decision") == "NO_TRADE"
          assert r.get("research_only") is True
          if r.get("markets"):
              assert all(m.get("shadow_eligible") is False for m in r["markets"])
          lines = [
              "## PolyShark BTC baseline — research only",
              "- Status: " + str(r.get("fit_status")),
              "- Event: " + str(r.get("event_slug")),
              "- Model: " + str(r.get("model_version")),
              "- Evaluated markets: " + str(r.get("markets_evaluated", 0)),
              "- Capital decision: **NO_TRADE**",
              "- Forward snapshots and verified resolutions are stored on data branch: polyshark-btc-forward-data.",
              "- Correlated Coinbase/Kraken data, uncalibrated forecast, Binance settlement basis risk.",
              "- No automatic Challenger evidence feed, live/paper orders, or strategy promotion.",
          ]
          if r.get("error_type"):
              lines.append("- Blocker: " + str(r.get("error_type")))
          summary = "\n".join(lines) + "\n"
          print(summary)
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as f:
                  f.write(summary)
          PY

      - name: Upload inspectable diagnostics (not canonical paper state)
        uses: actions/upload-artifact@v4
        with:
          name: btc-spot-research-snapshot
          path: |
            /tmp/polyshark-btc-research.json
            /tmp/polyshark-btc-forward-summary.json
          if-no-files-found: error
          retention-days: 14
