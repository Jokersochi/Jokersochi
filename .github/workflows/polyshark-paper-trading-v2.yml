name: PolyShark Paper Trading 24x7
# Session reset 2026-11-03T00:23:27.123Z: archived paper-20260827-restart-1000; trigger one immediate safe paper tick.

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions: минимальный поддерживаемый интервал расписания — 5 минут.
    # Здесь используется одноразовый --once. 24/7 требует отдельного постоянного runner.
    # Offset from :00; GitHub schedule is best-effort and may skip ticks.
    - cron: "3-58/5 * * * *"
  push:
    branches: [main]
    paths:
      - "polyshark-ai/runtime/paper_trader.py"
      - "polyshark-ai/runtime/paper_daemon.py"
      - "polyshark-ai/runtime/evidence_contract.py"
      - "polyshark-ai/runtime/challenger_v2.py"
      - "polyshark-ai/runtime/evidence_feed.py"
      - "polyshark-ai/tests/test_evidence_feed.py"
      - "polyshark-ai/tests/test_paper_trader_runtime.py"
      - "polyshark-ai/tests/test_paper_daemon.py"
      - "polyshark-ai/tests/test_evidence_contract.py"
      - "polyshark-ai/tests/test_evidence_contract_limits.py"
      - "polyshark-ai/tests/test_evidence_daemon_integration.py"
      - "polyshark-ai/tests/test_challenger_v2.py"
      - ".github/workflows/polyshark-paper-trading-v2.yml"

permissions:
  contents: write

concurrency:
  group: polyshark-paper-trading
  cancel-in-progress: false

jobs:
  paper-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить инварианты paper-only
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('polyshark-ai/runtime/paper_trader.py'),
              Path('polyshark-ai/runtime/paper_daemon.py'),
              Path('polyshark-ai/runtime/evidence_contract.py'),
              Path('polyshark-ai/runtime/challenger_v2.py'),
              Path('polyshark-ai/runtime/evidence_feed.py'),
          ]
          forbidden = ['create_order(', 'post_order(', 'cancel_all(', 'POLYMARKET_PRIVATE_KEY']
          hits = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              hits.extend(f'{path}:{item}' for item in forbidden if item in text)
          if hits:
              raise SystemExit(f'Обнаружены запрещённые примитивы реальной торговли: {hits}')
          print('Статическая защита paper-only: ПРОЙДЕНА')
          PY

      - name: Запустить тесты
        run: |
          python polyshark-ai/tests/test_paper_trader_runtime.py -q
          python polyshark-ai/tests/test_paper_daemon.py -q
          python polyshark-ai/tests/test_evidence_contract.py -q
          python polyshark-ai/tests/test_evidence_contract_limits.py -q
          python polyshark-ai/tests/test_evidence_daemon_integration.py -q
          python polyshark-ai/tests/test_challenger_v2.py -q
          python polyshark-ai/tests/test_evidence_feed.py -q
          python -m py_compile \
            polyshark-ai/runtime/paper_trader.py \
            polyshark-ai/runtime/paper_daemon.py \
            polyshark-ai/runtime/evidence_contract.py \
            polyshark-ai/runtime/challenger_v2.py \
            polyshark-ai/runtime/evidence_feed.py

      - name: Выполнить paper-tick с автоматическими повторами
        env:
          PAPER_STARTING_EQUITY: "1000"
          PAPER_CONTINUOUS_TARGET_EQUITY: "1000000000"
          PAPER_MAX_POSITION_PCT: "0.05"
          PAPER_MAX_OPEN_POSITIONS: "8"
          PAPER_ALLOW_LEGACY_MOMENTUM_ENTRIES: "false"
          PAPER_SHADOW_ENABLED: "true"
          PAPER_SHADOW_MIN_ENTRY_PRICE: "0.40"
          PAPER_SHADOW_MAX_SPREAD: "0.020"
          PAPER_SHADOW_REVIEW_MIN_24H: "100"
          PAPER_SHADOW_REVIEW_MIN_PROFIT_FACTOR: "1.20"
          PAPER_CALIBRATION_MIN_RESOLVED: "50"
          PAPER_CALIBRATION_MAX_BRIER: "0.25"
          PAPER_CALIBRATION_MAX_ECE: "0.10"
          PAPER_MIN_UNIQUE_MARKET_RATIO: "0.80"
          PAPER_CALIBRATION_LOOKUPS_PER_TICK: "25"
          PAPER_TICK_INTERVAL_SECONDS: "300"
          PAPER_RETRY_MIN_SECONDS: "15"
          PAPER_RETRY_MAX_SECONDS: "60"
        run: |
          set -u
          success=0
          for attempt in 1 2 3; do
            echo "Попытка ${attempt}/3"
            if python polyshark-ai/runtime/paper_daemon.py \
              --once \
              --state polyshark-ai/runtime/paper_state.json \
              --heartbeat /tmp/polyshark-paper-heartbeat.json; then
              success=1
              break
            fi
            sleep $((attempt * 15))
          done
          if [ "$success" -ne 1 ]; then
            echo "Paper-tick/evidence gate не восстановился после трёх попыток"
            exit 1
          fi

      - name: Проверить итоговое состояние
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('polyshark-ai/runtime/paper_state.json').read_text(encoding='utf-8'))
          assert state.get('paper_only') is True
          assert state.get('real_orders_enabled') is False
          assert state.get('legacy_momentum_entries_enabled') is False
          assert state.get('entry_policy') == 'legacy_momentum_blocked'
          assert state.get('capital_decision') == 'NO_TRADE'
          shadow = state.get('shadow_challenger')
          assert isinstance(shadow, dict)
          assert shadow.get('model_version') == 'event-evidence-v2-price-blind-20261029'
          assert shadow.get('auto_promotion') is False
          assert shadow.get('verdict') in {'NO_EVIDENCE', 'NOT_PROMOTED', 'ELIGIBLE_FOR_REVIEW'}
          for signal in shadow.get('signals', []):
              assert signal.get('paper_only') is True
              assert signal.get('capital_impact') == 0.0
          evidence = state.get('evidence_contract')
          assert isinstance(evidence, dict)
          assert evidence.get('contract_version') == 'trade-dossier-v2-challenger-20261029'
          dossier = evidence.get('trade_dossier')
          assert isinstance(dossier, dict)
          assert dossier.get('capital_decision') == 'NO_TRADE'
          assert dossier.get('auto_promotion') is False
          assert dossier.get('paper_only') is True
          assert dossier.get('real_orders_enabled') is False
          assert dossier.get('review_status') in {'BLOCKED', 'REVIEW_ELIGIBLE'}
          scan = evidence.get('last_calibration_scan', {})
          assert int(scan.get('lookups', 0)) <= 25
          for record in evidence.get('calibration_records', []):
              assert record.get('paper_only') is True
              assert record.get('capital_impact') == 0.0
          assert not state.get('last_error'), state.get('last_error')
          print({
              'status': state.get('status'),
              'equity': state.get('equity'),
              'open_positions': len(state.get('open_positions', [])),
              'ticks': state.get('ticks'),
              'paper_only': state.get('paper_only'),
              'capital_decision': state.get('capital_decision'),
              'shadow_signals': len(shadow.get('signals', [])),
              'shadow_verdict': shadow.get('verdict'),
              'evidence_review_status': dossier.get('review_status'),
              'evidence_blocked_by': dossier.get('blocked_by'),
              'calibration': dossier.get('calibration'),
              'calibration_scan': scan,
          })
          PY

      - name: Проверить периодичность и причины NO_TRADE
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          state = json.loads(Path("polyshark-ai/runtime/paper_state.json").read_text(encoding="utf-8"))
          health = state.get("operational_health", {})
          rows = [
              "## PolyShark paper-only runtime",
              "- Session: " + str(state.get("session_id")),
              "- Equity USD: " + str(state.get("equity")) + "; ticks: " + str(state.get("ticks")),
              "- Cadence: " + str(health.get("cadence", "UNKNOWN")) + "; gap s: " + str(health.get("tick_gap_seconds")),
              "- Research feed: " + str(health.get("research_feed_status", "UNKNOWN")),
              "- Evidence gate: " + str(health.get("evidence_review_status", "UNKNOWN")),
              "- Capital decision: " + str(state.get("capital_decision")),
              "- GitHub scheduled ticks are best-effort, not a continuously running worker.",
          ]
          report = "\n".join(rows) + "\n"
          print(report)
          summary_path = os.getenv("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fp:
                  fp.write(report)
          if health.get("cadence") == "DELAYED":
              print("::warning::Interval between successful paper ticks exceeded 15 minutes")
          if health.get("research_feed_status") == "DISABLED":
              print("::notice::Independent research feed disabled; NO_TRADE is expected")
          PY

      - name: Сохранить состояние paper-сессии
        run: |
          if git diff --quiet -- polyshark-ai/runtime/paper_state.json; then
            echo "Изменений состояния нет"
            exit 0
          fi
          git config user.name "polyshark-paper-bot"
          git config user.email "polyshark-paper-bot@users.noreply.github.com"
          git add polyshark-ai/runtime/paper_state.json
          git commit -m "chore(polyshark): persist 24x7 paper tick [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
