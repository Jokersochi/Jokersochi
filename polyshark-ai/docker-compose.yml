# ============================================
# PolyShark AI — Docker Compose
# Запуск: docker-compose up -d
# ============================================

version: '3.9'

services:

  # ---- Redis (кеш фич и рейтингов) ----
  redis:
    image: redis:7.2-alpine
    container_name: polyshark_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Основное приложение PolyShark ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polyshark_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000

  # ---- Агент (отдельный процесс) ----
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polyshark_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    command: python -m agents.orchestrator

  # ---- Непрерывный paper-only торговый процесс ----
  paper-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polyshark_paper_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PAPER_STARTING_EQUITY=1000
      - PAPER_CONTINUOUS_TARGET_EQUITY=1000000000
      - PAPER_TICK_INTERVAL_SECONDS=300
      - PAPER_RETRY_MIN_SECONDS=15
      - PAPER_RETRY_MAX_SECONDS=300
      - PAPER_MAX_POSITION_PCT=0.05
      - PAPER_MAX_OPEN_POSITIONS=8
    volumes:
      - ./runtime:/app/runtime
      - ./logs:/app/logs
    command: python runtime/paper_daemon.py --state runtime/paper_state.json --heartbeat runtime/paper_heartbeat.json --interval 300
    healthcheck:
      test: ["CMD", "python", "runtime/paper_daemon.py", "--heartbeat", "runtime/paper_heartbeat.json", "--healthcheck", "--health-max-age", "1000"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ---- Jupyter (для бэктестинга и исследований) ----
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polyshark_jupyter
    restart: "no"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
      - ./data:/app/data
      - ./models:/app/models
    command: jupyter notebook --ip=0.0.0.0 --no-browser --allow-root --NotebookApp.token=polyshark
    profiles:
      - research

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: polyshark_network
